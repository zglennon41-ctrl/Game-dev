<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WILDLINE — The Pulse Room</title>
    <style>
      :root { --bg: #14110f; --fg: #e8dcc8; --dim: #9a8c78; --accent: #d9a441; --red: #d9483b; --blue: #9fc6e8; --green: #9fe08a; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 Georgia, serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      .panel { position: fixed; pointer-events: none; }
      #hud { top: 12px; left: 16px; right: 16px; display: none; justify-content: space-between; align-items: flex-start; gap: 16px; }
      .bars { width: min(320px, 40vw); }
      .bar { height: 12px; background: #000; border: 1px solid #3a322a; margin: 3px 0 8px; position: relative; }
      .bar > div { height: 100%; }
      .bar .cost { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: 0.6; }
      .lbl { font-size: 12px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
      .right { text-align: right; }
      .big { font-size: 26px; color: var(--fg); }
      #prompt { left: 50%; transform: translateX(-50%); top: 70px; width: min(720px, 92vw); background: rgba(15,12,10,0.88); border: 1px solid #3a322a; padding: 12px 16px; display: none; }
      #prompt h3 { margin: 0 0 4px; font-weight: normal; color: var(--accent); letter-spacing: 0.05em; }
      #prompt p { margin: 0; }
      #prompt .row { display: flex; justify-content: space-between; margin-top: 6px; color: var(--dim); font-size: 13px; }
      #keys { bottom: 140px; left: 16px; color: var(--dim); font-size: 13px; display: none; }
      #keys b { color: var(--fg); font-weight: normal; border: 1px solid #4a4036; padding: 0 5px; margin-right: 3px; }
      #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,17,15,0.94); }
      #screen .box { width: min(640px, 92vw); padding: 16px; }
      #screen h1 { font-weight: normal; letter-spacing: 0.18em; color: var(--accent); margin: 0; }
      #screen h2 { font-weight: normal; margin: 4px 0 18px; color: var(--dim); font-size: 17px; }
      button { background: none; border: 1px solid var(--dim); color: var(--fg); padding: 10px 16px; margin: 6px 8px 6px 0; cursor: pointer; font: inherit; }
      button:hover, button:focus { border-color: var(--accent); color: var(--accent); outline: none; }
      button.primary { border-color: var(--accent); }
      table { border-collapse: collapse; margin: 8px 0 16px; }
      td { padding: 3px 18px 3px 0; }
      td:first-child { color: var(--dim); }
      a { color: var(--dim); }
      small { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud" class="panel">
      <div class="bars">
        <div class="lbl">Health <span id="hpv"></span></div>
        <div class="bar"><div id="hp" style="background: var(--red)"></div></div>
        <div class="lbl">Will <span id="willv"></span> <span id="state"></span></div>
        <div class="bar"><div id="will" style="background: var(--blue)"></div><div class="cost" style="left: 18%"></div></div>
        <div class="lbl" id="chain"></div>
      </div>
      <div class="right">
        <div class="big" id="timer"></div>
        <div class="lbl" id="score"></div>
      </div>
    </div>
    <div id="prompt" class="panel">
      <h3 id="ptitle"></h3>
      <p id="ptext"></p>
      <div class="row"><span id="pnote"></span><span id="pprog"></span></div>
    </div>
    <div id="keys" class="panel">
      <b>WASD</b> move &nbsp; <b>J</b> strike &nbsp; <b>I</b> Ground Strike (18 Will) &nbsp; <b>K</b> Hold / parry &nbsp; <b>L</b> Anchor stance &nbsp; <b>Esc</b> menu
    </div>
    <div id="screen"><div class="box" id="screenbox"></div></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
